SETTING_SOUND_BLIP2             = buttons/blip2.wav

SETTING_BEAM                    = sprites/white.spr
SETTING_BEAM_WIDTH              = 5
SETTING_BEAM_ALPHA              = 255
SETTING_COLOR_ACTIVE            = 0 255 0
SETTING_COLOR_INACTIVE          = 255 0 0

