#==============================================#
  # Bomb Site by RedSMURF: Configuration file #
#==============================================#

# To add a new bomb site, follow the example below
# [Bomb Site Name]
# BOMB_FLAGS                = a - Radar           b - Icon                  c - Active Delay
# BOMB_RADAR                = 0 - Disabled,       1 - Terrorists Only,      2 - CT Only,          3 - Both Teams
# BOMB_ACTIVE_CHANCE        = Probability the site activates each round       (0.0 = never,        1.0 = always)
# BOMB_ACTIVE_DELAY         = Random delay before the site goes active
# BOMB_ACTIVE_DURATION      = How long the site stays active
# BOMB_ACTIVE_COOLDOWN      = Cooldown before the site can reactivate

# BOMB_ICON                 = Path to the bomb site's icon sprite
# BOMB_ICON_SCALE           = Icon scale (Default = 0.1)
# BOMB_ICON_ALPHA           = Icon alpha (Default = 90)

# To make a bomb site available in the menu, you must define at least its name like this [Bomb Site]

# To make a bomb site available in the menu, you must defined at least it's name like this [Bomb Site]
[Main Settings]
SETTING_DEFAULT_FLAGS           = ab
SETTING_DEFAULT_RADAR           = 1
SETTING_DEFAULT_ACTIVE_CHANCE   = 1.0
SETTING_DEFAULT_ACTIVE_DELAY    = 5.0 10.0
SETTING_DEFAULT_ACTIVE_DURATION = 20.0 20.0
SETTING_DEFAULT_ACTIVE_COOLDOWN = 5.0 5.0
SETTING_DEFAULT_ICON            = sprites/BombSite/bombTarget.spr
SETTING_DEFAULT_ICON_SCALE      = 0.1
SETTING_DEFAULT_ICON_ALPHA      = 90

SETTING_BOMB_LOAD               = 1             # Whether to load saved Bomb Sites data of the current map
SETTING_BOMB_ANYWHERE           = 1             # Whether to allow placing Bomb Sites anywhere (overrides map-based restriction)
SETTING_OFFSET_BASE             = 90.0          # Default forward offset when previewing Bomb Site placement
SETTING_OFFSET                  = 42.0 900.0    # Minimum - Maximum offset from the player to the Bomb Site
SETTING_OFFSET_STEP             = 10.0          # Step size when scrolling to move Bomb Site forward/backward
SETTING_OFFSET_FREQ             = 0.1           # Scroll responsivness for placement offset (lower = faster)
SETTING_GHOST_FREQ              = 0.1           # Refresh rate of the ghost model (min = 0.1)

SETTING_SIZE_BASE               = 32.0
SETTING_SIZE_HEIGHT             = 5.0 1500.0
SETTING_SIZE_WIDTH              = 5.0 1500.0
SETTING_SIZE_DEPTH              = 5.0 1500.0

SETTING_SOUND_MENU_NAV          = buttons/blip1.wav
